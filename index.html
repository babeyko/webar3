<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Лог поднимаем ДО загрузки библиотек, чтобы поймать ошибки инициализации
    window.__log = [];
    function dbg(msg) {
      const line = new Date().toISOString().slice(11, 23) + ' ' + msg;
      window.__log.push(line);
      const el = document.getElementById('dbg');
      if (el) el.textContent = window.__log.slice(-30).join('\n');
    }
    window.addEventListener('error', e => dbg('ERROR: ' + (e.message || e) + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')));
    window.addEventListener('unhandledrejection', e => dbg('REJECT: ' + (e.reason && (e.reason.message || e.reason))));
    const _err = console.error, _warn = console.warn;
    console.error = (...a) => { dbg('console.error: ' + a.join(' ')); _err(...a); };
    console.warn  = (...a) => { dbg('console.warn: ' + a.join(' ')); _warn(...a); };
  </script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    a-scene { width: 100vw; height: 100vh; }
    #dbg {
      position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
      margin: 0; padding: 6px; max-height: 45vh; overflow: hidden;
      font: 11px/1.3 monospace; color: #0f0; background: rgba(0,0,0,.65);
      white-space: pre-wrap; pointer-events: none;
    }
  </style>
</head>
<body>
  <pre id="dbg"></pre>

  <a-scene id="scene" mindar-face="filterMinCF: 0.0001; filterBeta: 1" embedded
           vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera active="false" position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="faceTarget" mindar-face-target="anchorIndex: 168">
      <a-entity position="0 0.015 0.015" scale="0.72 0.72 0.72">
        <a-torus position="-0.30 0.02 0" radius="0.16" radius-tubular="0.022" color="#22d3ee"></a-torus>
        <a-torus position="0.30 0.02 0" radius="0.16" radius-tubular="0.022" color="#22d3ee"></a-torus>
        <a-box position="0 0.02 0" width="0.20" height="0.032" depth="0.03" color="#f8fafc"></a-box>
        <a-box position="-0.49 0.035 -0.015" width="0.22" height="0.03" depth="0.03" rotation="0 0 -8" color="#f8fafc"></a-box>
        <a-box position="0.49 0.035 -0.015" width="0.22" height="0.03" depth="0.03" rotation="0 0 8" color="#f8fafc"></a-box>
        <a-circle position="-0.30 0.02 0.008" radius="0.125" color="#0891b2" material="opacity: 0.22; transparent: true; side: double"></a-circle>
        <a-circle position="0.30 0.02 0.008" radius="0.125" color="#0891b2" material="opacity: 0.22; transparent: true; side: double"></a-circle>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    dbg('UA: ' + navigator.userAgent);
    dbg('DPR: ' + devicePixelRatio + ', viewport: ' + innerWidth + 'x' + innerHeight);

    // Что за GPU и есть ли WebGL2 (MediaPipe работает через WebGL2)
    try {
      const gl = document.createElement('canvas').getContext('webgl2');
      if (!gl) dbg('WebGL2: НЕТ');
      else {
        const ext = gl.getExtension('WEBGL_debug_renderer_info');
        dbg('WebGL2: да, GPU: ' + (ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : 'скрыт'));
      }
    } catch (e) { dbg('WebGL2 check failed: ' + e.message); }

    const scene = document.getElementById('scene');
    const target = document.getElementById('faceTarget');
    let found = 0;

    scene.addEventListener('loaded', () => dbg('A-Frame scene loaded'));
    scene.addEventListener('arReady', () => {
      dbg('MindAR arReady ✔');
      const v = document.querySelector('video');
      if (v) dbg('video: ' + v.videoWidth + 'x' + v.videoHeight);
    });
    scene.addEventListener('arError', e => dbg('MindAR arError ✘ ' + JSON.stringify(e.detail)));
    target.addEventListener('targetFound', () => dbg('targetFound #' + (++found)));
    target.addEventListener('targetLost', () => dbg('targetLost'));

    setTimeout(() => { if (!found) dbg('15 с без targetFound → трекинг не работает'); }, 15000);
  </script>
</body>
</html>
