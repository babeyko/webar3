<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AR-очки — MindAR Face Tracking</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background: #111827; }
      .hint { position: fixed; z-index: 10; left: 12px; right: 12px; bottom: 18px; padding: 12px 16px; border-radius: 12px; background: #111827dd; color: white; text-align: center; font-size: 14px; }
      .a-enter-vr { display: none !important; }
    </style>
  </head>
  <body>
    <div class="hint">Разрешите доступ к камере и смотрите в объектив. Очки закреплены на переносице.</div>
    <a-scene mindar-face="filterMinCF: 0.001; filterBeta: 1.0"
      embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera active="false" position="0 0 0"></a-camera>
      <!-- Anchor 168 is located at the center of the face near the nose bridge. -->
      <a-entity mindar-face-target="anchorIndex: 168">
        <a-entity position="0 0.02 0.02" scale="0.72 0.72 0.72">
          <!-- Lightweight procedural glasses: two lenses, bridge, and temples. -->
          <a-torus position="-0.30 0.02 0" radius="0.18" radius-tubular="0.025" color="#22d3ee"></a-torus>
          <a-torus position="0.30 0.02 0" radius="0.18" radius-tubular="0.025" color="#22d3ee"></a-torus>
          <a-box position="0 0.02 0" width="0.20" height="0.035" depth="0.035" color="#f8fafc"></a-box>
          <a-box position="-0.51 0.035 -0.025" width="0.25" height="0.035" depth="0.035" rotation="0 0 -8" color="#f8fafc"></a-box>
          <a-box position="0.51 0.035 -0.025" width="0.25" height="0.035" depth="0.035" rotation="0 0 8" color="#f8fafc"></a-box>
          <a-circle position="-0.30 0.02 0.008" radius="0.145" rotation="0 0 0" color="#0891b2" material="opacity: 0.24; transparent: true; side: double"></a-circle>
          <a-circle position="0.30 0.02 0.008" radius="0.145" color="#0891b2" material="opacity: 0.24; transparent: true; side: double"></a-circle>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
