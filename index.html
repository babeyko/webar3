<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FaceLandmarker GPU vs CPU</title>
  <style>
    html, body { margin: 0; background: #000; color: #0f0; font: 12px/1.35 monospace; }
    #wrap { position: relative; width: 100vw; }
    video, canvas { width: 100%; display: block; transform: scaleX(-1); }
    canvas { position: absolute; inset: 0; height: 100%; }
    #bar { display: flex; gap: 8px; padding: 8px; }
    button { flex: 1; padding: 12px; font: 14px monospace; }
    #log { padding: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="gpu">GPU</button>
    <button id="cpu">CPU</button>
  </div>
  <div id="wrap">
    <video id="v" playsinline muted autoplay></video>
    <canvas id="c"></canvas>
  </div>
  <pre id="log"></pre>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3';

    const logEl = document.getElementById('log');
    const lines = [];
    const log = m => { lines.push(new Date().toISOString().slice(11, 23) + ' ' + m); logEl.textContent = lines.slice(-25).join('\n'); };
    window.addEventListener('error', e => log('ERROR: ' + e.message));
    window.addEventListener('unhandledrejection', e => log('REJECT: ' + (e.reason?.message || e.reason)));

    log('UA: ' + navigator.userAgent);

    const video = document.getElementById('v');
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    await video.play();
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    log('video: ' + video.videoWidth + 'x' + video.videoHeight);

    const fileset = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm');

    let landmarker = null, mode = null, frames = 0, hits = 0;

    async function start(delegate) {
      if (landmarker) { landmarker.close(); landmarker = null; }
      mode = delegate; frames = 0; hits = 0;
      log('создаю FaceLandmarker, delegate=' + delegate + ' ...');
      try {
        landmarker = await FaceLandmarker.createFromOptions(fileset, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
            delegate
          },
          runningMode: 'VIDEO',
          numFaces: 1
        });
        log('готово (' + delegate + ')');
      } catch (e) { log('ошибка создания (' + delegate + '): ' + e.message); }
    }

    document.getElementById('gpu').onclick = () => start('GPU');
    document.getElementById('cpu').onclick = () => start('CPU');

    let lastReport = performance.now();
    function loop() {
      if (landmarker && video.readyState >= 2) {
        const res = landmarker.detectForVideo(video, performance.now());
        frames++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const face = res.faceLandmarks?.[0];
        if (face) {
          hits++;
          ctx.fillStyle = '#22d3ee';
          for (const p of face) ctx.fillRect(p.x * canvas.width - 1, p.y * canvas.height - 1, 2, 2);
        }
      }
      const now = performance.now();
      if (landmarker && now - lastReport > 2000) {
        log(mode + ': кадров ' + frames + ', с лицом ' + hits + ' (' + Math.round(frames / ((now - lastReport) / 1000)) + ' fps)');
        frames = 0; hits = 0; lastReport = now;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    start('GPU');
  </script>
</body>
</html>
