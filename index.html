<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    a-scene { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <!-- Сцена в template: вставляется в DOM только после загрузки MindAR -->
  <template id="sceneTpl">
    <!-- filterMinCF / filterBeta — сглаживание дрожания при движении головы -->
    <a-scene mindar-face="filterMinCF: 0.0001; filterBeta: 1" embedded
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera active="false" position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Процедурные бирюзовые очки из первого варианта -->
      <a-entity id="faceTarget" mindar-face-target="anchorIndex: 168">
        <a-entity position="0 0.015 0.015" scale="0.72 0.72 0.72">
          <a-torus position="-0.30 0.02 0" radius="0.16" radius-tubular="0.022" color="#22d3ee"></a-torus>
          <a-torus position="0.30 0.02 0" radius="0.16" radius-tubular="0.022" color="#22d3ee"></a-torus>
          <a-box position="0 0.02 0" width="0.20" height="0.032" depth="0.03" color="#f8fafc"></a-box>
          <a-box position="-0.49 0.035 -0.015" width="0.22" height="0.03" depth="0.03" rotation="0 0 -8" color="#f8fafc"></a-box>
          <a-box position="0.49 0.035 -0.015" width="0.22" height="0.03" depth="0.03" rotation="0 0 8" color="#f8fafc"></a-box>
          <a-circle position="-0.30 0.02 0.008" radius="0.125" color="#0891b2" material="opacity: 0.22; transparent: true; side: double"></a-circle>
          <a-circle position="0.30 0.02 0.008" radius="0.125" color="#0891b2" material="opacity: 0.22; transparent: true; side: double"></a-circle>
        </a-entity>
      </a-entity>
    </a-scene>
  </template>

  <script>
    // mind-ar 1.2.5 жёстко запускает MediaPipe FaceLandmarker на GPU.
    // На OnePlus 13 (Adreno 830) GPU-делегат не находит лицо, поэтому
    // качаем бандл и перед запуском переключаем делегат на CPU.
    const MINDAR_URL = 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js';
    const DELEGATE = 'CPU'; // 'GPU' — вернуть как было

    fetch(MINDAR_URL)
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(code => {
        const from = 'delegate:"GPU"},outputFaceBlendshapes';
        if (!code.includes(from)) console.warn('MindAR: место патча не найдено, остаётся GPU');
        code = code.replace(from, 'delegate:"' + DELEGATE + '"},outputFaceBlendshapes');

        const s = document.createElement('script');
        s.src = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
        s.onload = () => {
          URL.revokeObjectURL(s.src);
          document.body.appendChild(document.getElementById('sceneTpl').content.cloneNode(true));
        };
        document.head.appendChild(s);
      })
      .catch(e => console.error('Не удалось загрузить MindAR:', e));
  </script>
</body>
</html>
